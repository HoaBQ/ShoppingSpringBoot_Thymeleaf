<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - ShoppingSpringBoot">ShoppingSpringBoot</title>
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
    <style>
        body { background: #f5f7fb; }
        .site-header { background: linear-gradient(135deg, #172554, #2563eb); }
        .student-photo { width: 96px; height: 96px; object-fit: cover; border: 4px solid rgba(255,255,255,.9); box-shadow: 0 .5rem 1rem rgba(15,23,42,.25); }
        .admin-sidebar { background: #172554; min-height: 100%; }
        .admin-sidebar .nav-link { color: rgba(255,255,255,.75); border-radius: .5rem; }
        .admin-sidebar .nav-link:hover { color: #fff; background: #2563eb; }
        .site-footer { background: #172554; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<header class="site-header text-white shadow-sm">
    <div class="container py-4">
        <div class="row align-items-center">
            <div class="col-md-8">
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-shop display-6"></i>
                    <div>
                        <h1 class="h3 mb-1">ShoppingSpringBoot</h1>
                        <p class="mb-0 text-white-50">Hệ thống quản trị cửa hàng</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 text-center text-md-end mt-3 mt-md-0">
                <img class="student-photo rounded-circle" th:src="@{/assets/images/bui-quang-hoa.jpg}" alt="Ảnh cá nhân của sinh viên">
                <div class="mt-2">
                    <strong>Sinh viên thực hiện</strong>
                    <div class="small text-white-50">Quản trị viên</div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container-fluid flex-grow-1">
    <div class="row h-100">
        <aside class="admin-sidebar col-md-3 col-lg-2 p-3">
            <div class="text-uppercase text-white-50 small fw-semibold mb-3">Menu quản trị</div>
            <nav class="nav flex-column gap-2">
                <a class="nav-link" th:href="@{/admin/category/list}">
                    <i class="bi bi-tags me-2"></i>Category
                </a>
                <a class="nav-link" th:href="@{/admin/product/list}">
                    <i class="bi bi-box-seam me-2"></i>Product
                </a>
                <a class="nav-link" th:href="@{/admin/user/list}">
                    <i class="bi bi-people me-2"></i>User
                </a>
                <a class="nav-link" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-left me-2"></i>Đăng xuất
                </a>
            </nav>
        </aside>
        <main class="col-md-9 col-lg-10 py-4" layout:fragment="content"></main>
    </div>
</div>

<footer class="site-footer text-white-50 py-3 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
        <span><i class="bi bi-person me-1"></i>Sinh viên thực hiện: Bùi Quang Hòa</span>
        <span>MSSV: 24110213</span>
        <span>Lớp: Sáng T2 - T4</span>
    </div>
</footer>
</body>
</html>
