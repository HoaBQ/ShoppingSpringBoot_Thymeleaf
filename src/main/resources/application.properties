server.port=8080
server.servlet.context-path=/ShoppingSpringBoot
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Cấu hình SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ShoppingDB;encrypt=false
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.cache=false

# Cấu hình upload file ảnh (tối đa 10MB)
# Cho phép request đi vào controller để hiển thị cảnh báo riêng khi ảnh vượt 10MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload.dir=${user.home}/shopping-uploads
student.name=Sinh vi\u00ean th\u1ef1c hi\u1ec7n
student.id=M\u00e3 sinh vi\u00ean
student.class=L\u1edbp

# Bật log debug để xem SiteMesh xử lý decorator cho path nào
logging.level.org.sitemesh=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=TRACE
logging.level.org.apache.jasper=DEBUG